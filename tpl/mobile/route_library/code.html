</div>

<div class="relative mb-6">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full bg-surface-container-highest border-none rounded-lg py-4 pl-12 pr-4 text-white placeholder:text-on-surface-variant focus:ring-2 focus:ring-orange-500/50 transition-all" placeholder="Search routes..." type="text"/>

<button class="flex-none px-6 py-2 rounded-full bg-orange-600 text-on-primary-fixed font-label font-bold text-xs uppercase tracking-widest">5KM</button>
<button class="flex-none px-6 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-label font-bold text-xs uppercase tracking-widest">10KM</button>

</div>
<div class="p-5 flex justify-between items-end">
<div>

</div>
<div class="text-right">
<span class="font-headline text-4xl font-black text-white tracking-tighter">8.4</span>
<span class="font-label text-xs text-on-surface-variant font-bold ml-1">KM</span>
</div>
</div>
</div>

<div class="text-right">

</div>
</div>

</div>

</div>

<div class="absolute inset-0 flex flex-col items-center justify-center pt-10">
<div class="bg-neutral-900/80 backdrop-blur-xl p-8 rounded-2xl border border-white/5 text-center shadow-2xl">

<button class="fixed bottom-28 right-6 w-14 h-14 bg-orange-600 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-transform z-40">
