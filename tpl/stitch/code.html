<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>THE RUN - Join the Movement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Manrope:wght@200..800&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ff5722",
                        "primary-fixed-dim": "#ff5722",
                        "on-primary-fixed": "#000000",
                        "background": "#0e0e0e",
                        "surface": "#0e0e0e",
                        "on-surface": "#ffffff",
                        "on-background": "#ffffff",
                        "on-surface-variant": "#adaaaa",
                        "outline-variant": "#494847"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hero-gradient {
            background: linear-gradient(to top, #0e0e0e 0%, rgba(14, 14, 14, 0.95) 25%, rgba(14, 14, 14, 0.4) 60%, rgba(14, 14, 14, 0.2) 100%);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body antialiased overflow-hidden">
<!-- Main Landing Container -->
<main class="relative h-screen w-full flex flex-col justify-between overflow-hidden">
<!-- Hero Background Image (from SCREEN_4) -->
<div class="absolute inset-0 z-0">
<img alt="Diverse group of high-performance runners sprinting through neon-lit urban city streets at night" class="h-full w-full object-cover grayscale contrast-125 brightness-75" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAp9Ws4ALuRveULh7WZd0aFASqrd-63XkoO04YWy2qRWfkmz5CDcxudpehbxCodexzSBg2gDAs326K4zahl7OxT6E410sq_s-wfR1vJfhv3nPKP7GX8Tbu3Id_O8dPA2qj6vJwjEKWx5t_xfa6y0dmea2I0oUs9XsbqjpowRp11aCfjxNKkvs8LyT2iqWeu_T017iao8UqF4xmuYUUafsrotrjBR9KijxUJzc0bFoBmxkAkcXMXZ0bx78bSX9UV3vLAPM0Yw1Nd7t8"/>
<!-- Gradient Overlay for legibility -->
<div class="absolute inset-0 hero-gradient"></div>
</div>
<!-- Center Hero Section (Typography from SCREEN_4) -->
<section class="relative z-10 px-8 flex flex-col items-center justify-center flex-grow pt-24 text-center">
<h1 class="font-headline text-[5rem] md:text-[8rem] font-black leading-none tracking-tighter text-on-background drop-shadow-2xl italic">
                THE RUN
            </h1>
<p class="font-headline text-xl md:text-2xl font-light tracking-[0.2em] mt-2 uppercase text-on-surface-variant">
                Run. Community. Repeat.
            </p>
</section>
<!-- Bottom Action Area (Layout and Content from SCREEN_8) -->
<section class="relative z-10 w-full p-8 pb-16">
<div class="flex flex-col gap-6 max-w-md mx-auto">
<!-- Primary Button: Join a Run -->
<button class="w-full bg-primary hover:brightness-110 py-5 rounded-lg flex items-center justify-center gap-3 transition-transform active:scale-[0.98] shadow-lg">
<span class="material-symbols-outlined text-on-primary-fixed text-2xl" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-headline font-black text-on-primary-fixed text-lg tracking-tight uppercase">Join a Run (Scan/Code)</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="font-label text-xs font-bold text-on-surface-variant tracking-widest">OR</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<!-- Secondary Button: Create Full Account -->
<button class="w-full border-2 border-primary hover:bg-primary/10 py-5 rounded-lg transition-all active:scale-[0.98]">
<span class="font-headline font-black text-on-surface text-lg tracking-tight uppercase">Create Full Account</span>
</button>
<!-- Footer text -->
<div class="mt-4 text-center">
<a class="inline-flex items-center gap-1 group" href="#">
<span class="font-label text-sm text-on-surface-variant group-hover:text-primary transition-colors">Already registered?</span>
<span class="font-label text-sm text-on-surface font-bold group-hover:text-primary transition-colors">Log in</span>
</a>
</div>
</div>
</section>
</main>
<!-- Overlay Grain Texture for cinematic feel -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-50 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
</body></html>
